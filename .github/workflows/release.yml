name: Publish shaderpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release
          persist-credentials: false
      - name: Build and verify release archive
        run: |
          python3 tools/package.py
          git diff --exit-code -- dist/EnchantedMine.zip
      - name: Upload shaderpack
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload release dist/EnchantedMine.zip --clobber
