name: Shaderpack checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Mesa EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r tools/test-requirements.txt
      - name: Check packaging security
        run: .venv/bin/python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Compile and exercise shaders
        run: .venv/bin/python tools/smoke_test.py
      - name: Build shaderpack
        run: .venv/bin/python tools/package.py
