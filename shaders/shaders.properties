# The pack supplies its own underwater absorption; do not overlay the vanilla texture.
underwaterOverlay=false
screen=REFLECTION_STEPS REFLECTION_STRENGTH HAND_LIGHT EXPOSURE BLOOM_STRENGTH MOTION_BLUR TEXTURE_DEPTH AO_STRENGTH
sliders=REFLECTION_STRENGTH HAND_LIGHT EXPOSURE BLOOM_STRENGTH MOTION_BLUR TEXTURE_DEPTH AO_STRENGTH
profile.LOW=REFLECTION_STEPS:16 BLOOM_STRENGTH:0.35 MOTION_BLUR:0.0 AO_STRENGTH:0.25
profile.MEDIUM=REFLECTION_STEPS:32 BLOOM_STRENGTH:0.65 MOTION_BLUR:0.5 AO_STRENGTH:0.45
profile.HIGH=REFLECTION_STEPS:64 BLOOM_STRENGTH:1.0 MOTION_BLUR:0.5 AO_STRENGTH:0.65
# Normal/material and emission attachments are data, never alpha-blended colours.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
