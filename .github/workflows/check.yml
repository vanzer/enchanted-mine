name: Shaderpack checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build shaderpack
        run: python3 tools/package.py
      - name: Verify published archive is current
        run: git diff --exit-code -- dist/EnchantedMine.zip
