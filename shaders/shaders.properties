screen= <profile> [LIGHTING] [REFLECTIONS] [ATMOSPHERE] [MATERIALS] [CAMERA] EXPOSURE
screen.LIGHTING=SHADOWS SHADOW_STRENGTH shadowMapResolution shadowDistance HAND_LIGHT AO_STRENGTH AO_RADIUS INDIRECT_STRENGTH CONTACT_SHADOW_STRENGTH
screen.REFLECTIONS=REFLECTION_STEPS REFLECTION_STRENGTH
screen.ATMOSPHERE=FOG_STRENGTH SUN_SHAFT_STRENGTH BLOOM_STRENGTH PROCEDURAL_CLOUDS CLOUD_COVERAGE
screen.MATERIALS=LAB_PBR
screen.CAMERA=DEPTH_OF_FIELD DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH
# colortex1 stores normals and reflectivity, not transparency. Blending these
# values with the background corrupts both decoding and screen-space effects.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured_lit.colortex1=off
sliders=SHADOW_STRENGTH HAND_LIGHT AO_STRENGTH AO_RADIUS INDIRECT_STRENGTH CONTACT_SHADOW_STRENGTH REFLECTION_STRENGTH FOG_STRENGTH SUN_SHAFT_STRENGTH BLOOM_STRENGTH CLOUD_COVERAGE DOF_STRENGTH MOTION_BLUR_STRENGTH EXPOSURE
profile.LOW=REFLECTION_STEPS:16 SHADOWS:0 AO_STRENGTH:0.0 SUN_SHAFT_STRENGTH:0.0 BLOOM_STRENGTH:0.0
profile.MEDIUM=REFLECTION_STEPS:32 SHADOWS:1 AO_STRENGTH:0.45 SUN_SHAFT_STRENGTH:0.15 BLOOM_STRENGTH:0.18
profile.HIGH=REFLECTION_STEPS:64 SHADOWS:1 AO_STRENGTH:0.7 SUN_SHAFT_STRENGTH:0.25 BLOOM_STRENGTH:0.3
