profile.HIGH=REFLECTION_STEPS:64 REFLECTION_STRENGTH:0.8 REFLECTION_CLOUDS:1 SHADOWS:1 shadowMapResolution:4096 shadowDistance:192.0 SHADOW_FILTER:2 SHADOW_SOFTNESS:1.8 SHADOW_STRENGTH:0.65 AO_STRENGTH:0.7 AO_RADIUS:2.0 INDIRECT_STRENGTH:0.2 CONTACT_SHADOW_STRENGTH:0.3 TEXTURE_BUMP:0.4 MATERIAL_AO:0.6 SPECULAR_STRENGTH:1.0 LEAF_TRANSLUCENCY:0.45 WIND_STRENGTH:0.5 WATER_REFRACTION:0.75 WATER_ABSORPTION:1.0 UNDERWATER_FOG:1.0 FOG_STRENGTH:0.35 HEIGHT_FOG:0.2 VOLUMETRIC_LIGHT:0.5 VOLUMETRIC_STEPS:20 SUN_SHAFT_STRENGTH:0.25 VOLUMETRIC_CLOUDS:1 CLOUD_STEPS:32 CLOUD_SHADOWS:1 CLOUD_SHADOW_STRENGTH:0.45 AURORA_STRENGTH:1.0 TAA:1 TAA_JITTER:0 TAA_STRENGTH:0.8 FXAA:1 FXAA_STRENGTH:1.0 MOTION_BLUR MOTION_BLUR_STRENGTH:0.5 MOTION_BLUR_SAMPLES:8 !DEPTH_OF_FIELD DOF_STRENGTH:1.0 DOF_RADIUS:9.0 BLOOM_STRENGTH:0.5 BLOOM_RADIUS:1.0 BLOOM_THRESHOLD:0.0
