# Enchanted Mine: custom linear-HDR scene and procedural atmosphere.
oldLighting=false
underwaterOverlay=false
clouds=off
sun=false
moon=false
stars=false
dhShadow.enabled=false

screen=<profile> RTX [LIGHTING] [SHADOWS] [REFLECTIONS] [WATER] [ATMOSPHERE] [SKY] [CLOUDS] [MATERIALS] [CAMERA] [POST] [COMPATIBILITY]
screen.columns=2
screen.LIGHTING=SUN_LIGHT MOON_LIGHT SKY_LIGHT BLOCK_LIGHT HAND_LIGHT DIRECT_CONTRAST LEAF_TRANSLUCENCY EMISSION_STRENGTH SPECULAR_STRENGTH
screen.LIGHTING.columns=2
screen.SHADOWS=SHADOWS SHADOW_STRENGTH shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS CONTACT_SHADOW_STRENGTH
screen.SHADOWS.columns=2
screen.REFLECTIONS=REFLECTION_STEPS REFLECTION_STRENGTH REFLECTION_MINIMUM REFLECTION_CLOUDS
screen.REFLECTIONS.columns=2
screen.WATER=WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_OPACITY WATER_REFRACTION WATER_ABSORPTION UNDERWATER_FOG
screen.WATER.columns=2
screen.ATMOSPHERE=FOG_STRENGTH HEIGHT_FOG VOLUMETRIC_LIGHT VOLUMETRIC_STEPS SUN_SHAFT_STRENGTH
screen.ATMOSPHERE.columns=2
screen.SKY=SKY_BRIGHTNESS SUNSET_STRENGTH SUN_GLOW STAR_STRENGTH AURORA_STRENGTH
screen.SKY.columns=2
screen.CLOUDS=VOLUMETRIC_CLOUDS CLOUD_STEPS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_SPEED CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH
screen.CLOUDS.columns=2
screen.MATERIALS=LAB_PBR TEXTURE_BUMP MATERIAL_AO AO_STRENGTH AO_RADIUS INDIRECT_STRENGTH WIND_STRENGTH WIND_SPEED
screen.MATERIALS.columns=2
screen.CAMERA=TAA TAA_JITTER TAA_STRENGTH FXAA FXAA_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH MOTION_BLUR_SAMPLES DEPTH_OF_FIELD DOF_STRENGTH DOF_RADIUS
screen.CAMERA.columns=2
screen.POST=BLOOM_STRENGTH BLOOM_RADIUS BLOOM_THRESHOLD EXPOSURE SATURATION CONTRAST
screen.POST.columns=2
screen.COMPATIBILITY=DH_SUPPORT
screen.COMPATIBILITY.columns=2

# Normals, emission and surface-class metadata must never alpha-blend.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.dh_terrain.colortex1=off
blend.dh_terrain.colortex2=off
blend.dh_water.colortex1=off
blend.dh_water.colortex2=off
# Preserve scene alpha for water composition; RGB uses standard transparency.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Disabling the compatibility option skips both root and dimension DH programs.
#if DH_SUPPORT == 0
program.dh_terrain.enabled=false
program.dh_water.enabled=false
program.world0/dh_terrain.enabled=false
program.world0/dh_water.enabled=false
program.world-1/dh_terrain.enabled=false
program.world-1/dh_water.enabled=false
program.world1/dh_terrain.enabled=false
program.world1/dh_water.enabled=false
#endif

sliders=SUN_LIGHT MOON_LIGHT SKY_LIGHT BLOCK_LIGHT HAND_LIGHT DIRECT_CONTRAST LEAF_TRANSLUCENCY EMISSION_STRENGTH SPECULAR_STRENGTH SHADOW_STRENGTH SHADOW_SOFTNESS shadowDistance CONTACT_SHADOW_STRENGTH REFLECTION_STRENGTH REFLECTION_MINIMUM WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_OPACITY WATER_REFRACTION WATER_ABSORPTION UNDERWATER_FOG FOG_STRENGTH HEIGHT_FOG VOLUMETRIC_LIGHT SUN_SHAFT_STRENGTH SKY_BRIGHTNESS SUNSET_STRENGTH SUN_GLOW STAR_STRENGTH AURORA_STRENGTH CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_SPEED CLOUD_SHADOW_STRENGTH TEXTURE_BUMP MATERIAL_AO AO_STRENGTH AO_RADIUS INDIRECT_STRENGTH WIND_STRENGTH WIND_SPEED TAA_STRENGTH FXAA_STRENGTH MOTION_BLUR_STRENGTH DOF_STRENGTH DOF_RADIUS BLOOM_STRENGTH BLOOM_RADIUS BLOOM_THRESHOLD EXPOSURE SATURATION CONTRAST

# Profiles reset effect strengths and sample budgets. RTX, color and compatibility remain independent.
